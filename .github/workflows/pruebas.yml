# Ejecuta las pruebas de la web en Chrome antes de fusionar en main.
# GitHub Pages sigue publicando main tal cual (sin compilación): este flujo solo comprueba.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los ejecutores de GitHub ya traen Google Chrome; playwright-core lo usa con channel "chrome"
      - run: npm test
